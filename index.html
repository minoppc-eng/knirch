<style id="lock-style">
:root {
  --l-bg: #FFFFFF; --l-bg-2: #F4F4F5; --l-fg: #18181B; --l-fg-2: #52525B; --l-fg-3: #A1A1AA;
  --l-accent: #B84872; --l-border: #E4E4E7; --l-bad: #B42318;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --l-bg: #0F0F10; --l-bg-2: #18181B; --l-fg: #FAFAFA; --l-fg-2: #A1A1AA; --l-fg-3: #71717A; --l-accent: #D4607E; --l-border: #27272A; --l-bad: #F2867C; color-scheme: dark; }
}
:root[data-theme="dark"] { --l-bg: #0F0F10; --l-bg-2: #18181B; --l-fg: #FAFAFA; --l-fg-2: #A1A1AA; --l-fg-3: #71717A; --l-accent: #D4607E; --l-border: #27272A; --l-bad: #F2867C; color-scheme: dark; }
body { background: var(--l-bg); color: var(--l-fg); font-family: 'DM Sans', system-ui, sans-serif; margin: 0; }
#lock { min-height: 100vh; display: grid; place-items: center; padding-block: 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); box-sizing: border-box; }
.lk { width: 100%; max-width: 380px; }
.lk-brand { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 800; font-size: 1.25rem; letter-spacing: -0.02em; color: var(--l-accent); }
.lk-eyebrow { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--l-fg-3); margin: 40px 0 10px; }
.lk h1 { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 800; font-size: 1.75rem; letter-spacing: -0.03em; line-height: 1.12; margin: 0 0 10px; }
.lk p { font-size: 0.9rem; color: var(--l-fg-2); line-height: 1.6; margin: 0 0 24px; }
.lk label { display: block; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--l-fg-3); margin-bottom: 8px; }
.lk-row { display: flex; gap: 8px; }
.lk input { flex: 1; min-width: 0; font: inherit; font-size: 1rem; padding: 11px 14px; border: 1px solid var(--l-border); border-radius: 5px; background: var(--l-bg); color: var(--l-fg); }
.lk input:focus { outline: 2px solid var(--l-accent); outline-offset: 1px; border-color: var(--l-accent); }
.lk button { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 700; font-size: 0.9rem; padding: 11px 18px; border: 0; border-radius: 5px; background: var(--l-accent); color: #fff; cursor: pointer; }
.lk button:focus-visible { outline: 2px solid var(--l-fg); outline-offset: 2px; }
.lk button[disabled] { opacity: .6; cursor: wait; }
.lk-err { font-size: 0.84rem; color: var(--l-bad); margin-top: 10px; min-height: 1.3em; }
.lk-hint { font-size: 0.78rem; color: var(--l-fg-3); }
.lk-foot { margin-top: 48px; padding-top: 18px; border-top: 1px solid var(--l-border); font-size: 0.78rem; color: var(--l-fg-3); }
</style>

      <button type="submit" id="lk-btn">Přihlásit</button>
    </div>

    <div class="lk-hint">Heslo rozlišuje velká a malá písmena.</div>
    <div class="lk-foot">Miriam Nováková · MINO</div>
  </form>
</div>

  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const form = document.getElementById('lk-form'), inp = document.getElementById('lk-pass'),
        btn = document.getElementById('lk-btn'), err = document.getElementById('lk-err');
  async function unlock(pw) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(P.s), iterations: P.i, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const buf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.v) }, key, b64(P.d));
    return new TextDecoder().decode(buf);
  }
  function mount(html) {
    document.getElementById('lock').remove();
    document.getElementById('lock-style').remove();
    const app = document.getElementById('app');
    app.innerHTML = html;
    app.querySelectorAll('script').forEach(old => {
      const s = document.createElement('script');
      s.textContent = old.textContent;
      old.replaceWith(s);
    });
  }
  async function attempt(pw, silent) {
    btn.disabled = true; err.textContent = '';
    if (!(window.crypto && crypto.subtle)) {
      err.textContent = 'Tento náhled neumí přehled odemknout. Stáhněte soubor a otevřete ho v prohlížeči (Chrome, Safari, Edge nebo Firefox).';
      btn.disabled = false; return;
    }
    let html;
    try {
      html = await unlock(pw);
    } catch (e) {
      try { sessionStorage.removeItem('mino-kv'); } catch (e2) {}
      if (!silent) { err.textContent = 'Nesprávné heslo. Zkontrolujte velká a malá písmena a zkuste to znovu.'; inp.select(); }
      btn.disabled = false; return;
    }
    try { sessionStorage.setItem('mino-kv', pw); } catch (e) {}
    try { mount(html); }
    catch (e) { err.textContent = 'Heslo je správně, ale přehled se nepodařilo zobrazit. Zkuste ho otevřít v jiném prohlížeči.'; btn.disabled = false; }
  }
  form.addEventListener('submit', e => { e.preventDefault(); const v = inp.value.trim(); if (v) attempt(v, false); });
  let saved = null;
  try { saved = sessionStorage.getItem('mino-kv'); } catch (e) {}
  if (saved) attempt(saved, true);
})();
